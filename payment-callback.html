<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Processing - Netyark Mall</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .payment-callback-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            padding: 50px;
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        .payment-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 50px;
        }

        .payment-icon.processing {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .payment-icon.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .payment-icon.error {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .payment-title {
            font-size: 28px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .payment-message {
            font-size: 16px;
            color: #636e72;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .payment-details {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: left;
        }

        .payment-details h4 {
            color: #2d3436;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #636e72;
            font-size: 14px;
        }

        .detail-value {
            color: #2d3436;
            font-weight: 600;
            font-size: 14px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #008000 0%, #006400 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 128, 0, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #008000;
            color: #008000;
            margin-left: 10px;
        }

        .btn-outline:hover {
            background: #008000;
            color: white;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .checkmark {
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .crossmark {
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="payment-callback-container">
        <div class="payment-icon processing" id="paymentIcon">
            <div class="spinner"></div>
        </div>
        <h1 class="payment-title" id="paymentTitle">Processing Payment...</h1>
        <p class="payment-message" id="paymentMessage">Please wait while we verify your payment.</p>
        
        <div class="payment-details" id="paymentDetails" style="display: none;">
            <h4>Order Details</h4>
            <div class="detail-row">
                <span class="detail-label">Order ID:</span>
                <span class="detail-value" id="orderId">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Amount:</span>
                <span class="detail-value" id="orderAmount">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status:</span>
                <span class="detail-value" id="orderStatus">-</span>
            </div>
        </div>

        <div class="action-buttons" id="actionButtons" style="display: none;">
            <a href="profile.html" class="btn btn-primary" id="profileBtn">
                <i class="fas fa-user"></i> View Profile
            </a>
            <a href="index.html" class="btn btn-outline" id="homeBtn">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        // Payment Callback Handler
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('Payment callback page loaded');
            
            // Get query parameters from URL
            const urlParams = new URLSearchParams(window.location.search);
            const reference = urlParams.get('reference') || urlParams.get('trxref');
            const status = urlParams.get('status');
            const orderId = urlParams.get('orderId');

            console.log('Payment callback params:', { reference, status, orderId });

            // Also check for stored Paystack reference
            if (!reference) {
                const storedReference = localStorage.getItem('paystack_reference');
                if (storedReference) {
                    console.log('Using stored Paystack reference:', storedReference);
                    reference = storedReference;
                }
            }

            if (!reference) {
                showError('No payment reference found. Please contact support.');
                return;
            }

            try {
                // Verify payment with backend
                console.log('Verifying payment with reference:', reference);
                
                // Get stored order data if available
                const pendingOrderData = localStorage.getItem('pendingOrderData');
                let orderData = null;
                if (pendingOrderData) {
                    try {
                        orderData = JSON.parse(pendingOrderData);
                    } catch (e) {
                        console.error('Error parsing pending order data:', e);
                    }
                }
                
                const response = await fetch('https://netyarkmall-production.up.railway.app/api/payments/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        reference: reference,
                        orderData: orderData
                    })
                });

                const result = await response.json();
                console.log('Payment verification result:', result);

                if (result.success) {
                    // Payment successful
                    // Clear stored payment data
                    localStorage.removeItem('paystack_reference');
                    localStorage.removeItem('pendingOrderData');
                    
                    showSuccess(result.data);
                } else {
                    // Payment verification failed
                    showError(result.message || 'Payment verification failed. Please contact support.');
                }
            } catch (error) {
                console.error('Payment verification error:', error);
                
                // Try to check order status directly
                if (orderId) {
                    try {
                        const orderResponse = await fetch(`https://netyarkmall-production.up.railway.app/api/orders/${orderId}`);
                        const orderResult = await orderResponse.json();
                        
                        if (orderResult.success && orderResult.data.paymentStatus === 'paid') {
                            showSuccess(orderResult.data);
                            return;
                        }
                    } catch (orderError) {
                        console.error('Order status check error:', orderError);
                    }
                }
                
                showError('An error occurred while verifying your payment. Please check your order in your profile.');
            }
        });

        function showSuccess(data) {
            const icon = document.getElementById('paymentIcon');
            const title = document.getElementById('paymentTitle');
            const message = document.getElementById('paymentMessage');
            const details = document.getElementById('paymentDetails');
            const buttons = document.getElementById('actionButtons');

            // Update icon
            icon.className = 'payment-icon success';
            icon.innerHTML = '<i class="fas fa-check checkmark" style="font-size: 50px;"></i>';

            // Update text
            title.textContent = 'Payment Successful!';
            message.textContent = 'Thank you for your order. Your payment has been confirmed and your order has been placed successfully.';

            // Show order details
            details.style.display = 'block';
            document.getElementById('orderId').textContent = data.orderId ? data.orderId.substring(0, 8) + '...' : '-';
            document.getElementById('orderAmount').textContent = data.amount ? 'GH₵' + data.amount.toLocaleString() : '-';
            document.getElementById('orderStatus').textContent = 'Confirmed';

            // Show action buttons
            buttons.style.display = 'flex';

            // Check if user is logged in
            const isLoggedIn = localStorage.getItem('token') !== null || localStorage.getItem('netyark_current_user') !== null;
            
            // Update button visibility based on login status
            const profileBtn = document.getElementById('profileBtn');
            const homeBtn = document.getElementById('homeBtn');

            if (isLoggedIn) {
                profileBtn.style.display = 'inline-flex';
                homeBtn.style.display = 'none';
            } else {
                profileBtn.style.display = 'none';
                homeBtn.style.display = 'inline-flex';
                homeBtn.href = 'index.html?order=success';
            }

            // Clear cart
            localStorage.removeItem('cart');

            // Store success message for display
            localStorage.setItem('orderSuccess', 'true');
            localStorage.setItem('orderId', data.orderId || '');
        }

        function showError(message) {
            const icon = document.getElementById('paymentIcon');
            const title = document.getElementById('paymentTitle');
            const messageEl = document.getElementById('paymentMessage');
            const details = document.getElementById('paymentDetails');
            const buttons = document.getElementById('actionButtons');

            // Update icon
            icon.className = 'payment-icon error';
            icon.innerHTML = '<i class="fas fa-times crossmark" style="font-size: 50px;"></i>';

            // Update text
            title.textContent = 'Payment Failed';
            messageEl.textContent = message;

            // Show order details (empty)
            details.style.display = 'block';
            document.getElementById('orderId').textContent = '-';
            document.getElementById('orderAmount').textContent = '-';
            document.getElementById('orderStatus').textContent = 'Failed';

            // Show action buttons
            buttons.style.display = 'flex';

            // Only show home button for error case
            const profileBtn = document.getElementById('profileBtn');
            const homeBtn = document.getElementById('homeBtn');
            profileBtn.style.display = 'none';
            homeBtn.style.display = 'inline-flex';
            homeBtn.href = 'index.html?order=failed';
        }

        // Auto-redirect after showing message
        setTimeout(function() {
            const isLoggedIn = localStorage.getItem('token') !== null || localStorage.getItem('netyark_current_user') !== null;
            
            if (document.getElementById('paymentIcon').classList.contains('success')) {
                if (isLoggedIn) {
                    window.location.href = 'profile.html?tab=orders';
                } else {
                    window.location.href = 'index.html?order=success';
                }
            }
        }, 8000);
    </script>
</body>
</html>
