<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetyarkMall AIMS - Staff Login</title>
  <link rel="stylesheet" href="admin.css">
  <style>
    /* Login Page Specific Styles */
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #f4f6f9 0%, #e9ecef 50%, #dee2e6 100%);
      position: relative;
      overflow: hidden;
    }

    .auth-container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(40,167,69,0.08) 0%, transparent 50%);
      animation: pulse 15s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 50px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      position: relative;
      z-index: 1;
      animation: slideUp 0.6s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #28a745, #fd7e14, #20c997);
      border-radius: 24px 24px 0 0;
    }

    .auth-logo {
      display: block;
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 8px 25px rgba(40,167,69,0.25);
      transition: transform 0.3s ease;
    }

    .auth-logo:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .auth-title {
      text-align: center;
      font-size: 1.8em;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 8px;
    }

    .auth-subtitle {
      text-align: center;
      color: #718096;
      font-size: 0.95em;
      margin-bottom: 30px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .auth-form .form-group {
      position: relative;
    }

    .auth-form label {
      display: block;
      font-size: 0.9em;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .auth-form input {
      width: 100%;
      padding: 16px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 1em;
      transition: all 0.3s ease;
      background: #f8f9fa;
    }

    .auth-form input:focus {
      outline: none;
      border-color: #28a745;
      box-shadow: 0 0 0 4px rgba(40,167,69,0.1);
      background: white;
      transform: translateY(-2px);
    }

    .auth-form input::placeholder {
      color: #a0aec0;
    }

    .auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(40,167,69,0.3);
      margin-top: 10px;
    }

    .auth-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(40,167,69,0.4);
    }

    .auth-btn:active {
      transform: translateY(-1px);
    }

    .auth-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .auth-btn.loading::before {
      content: '';
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .auth-error {
      background: rgba(220,53,69,0.1);
      color: #dc3545;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.9em;
      text-align: center;
      border: 1px solid rgba(220,53,69,0.2);
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .auth-footer {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .auth-footer p {
      color: #718096;
      font-size: 0.95em;
    }

    .auth-footer a {
      color: #28a745;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
      position: relative;
    }

    .auth-footer a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: #28a745;
      transition: width 0.3s ease;
    }

    .auth-footer a:hover::after {
      width: 100%;
    }

    .auth-footer a:hover {
      color: #218838;
    }

    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      font-size: 1.2em;
      transition: color 0.3s ease;
    }

    .password-toggle:hover {
      color: #4a5568;
    }

    /* Decorative elements */
    .decoration {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .decoration-1 {
      width: 300px;
      height: 300px;
      background: linear-gradient(135deg, rgba(40,167,69,0.1) 0%, rgba(32,201,151,0.05) 100%);
      top: -100px;
      right: -100px;
    }

    .decoration-2 {
      width: 200px;
      height: 200px;
      background: linear-gradient(135deg, rgba(253,126,20,0.1) 0%, rgba(253,126,20,0.05) 100%);
      bottom: -50px;
      left: -50px;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .auth-card {
        padding: 40px 25px;
      }

      .auth-title {
        font-size: 1.5em;
      }

      .auth-logo {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <div class="auth-card">
      <img src="Netyark.jfif" alt="Netyark Mall Logo" class="auth-logo">
      <h1 class="auth-title">Staff Login</h1>
      <p class="auth-subtitle">Access the Admin & Inventory Management System</p>
      
      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="auth-btn">
          <span>Sign In</span>
          <span>→</span>
        </button>
      </form>
      
      <p id="login-error" class="auth-error" style="display: none;"></p>
      
      <div class="auth-footer">
        <p>Don't have an account? <a href="admin-register.html">Create Super Admin Account</a></p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = '/api';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = e.target.querySelector('.auth-btn');
      const originalContent = submitBtn.innerHTML;
      submitBtn.innerHTML = '<span>Signing in...</span>';
      submitBtn.classList.add('loading');
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('login-error');
      
      errorEl.style.display = 'none';
      
      try {
        const res = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('refreshToken', data.refreshToken);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          submitBtn.innerHTML = '<span>Success!</span> <span>✓</span>';
          
          setTimeout(() => {
            window.location.href = 'admin.html';
          }, 500);
        } else {
          submitBtn.innerHTML = originalContent;
          submitBtn.classList.remove('loading');
          
          errorEl.textContent = data.message || 'Login failed. Please try again.';
          errorEl.style.display = 'block';
        }
      } catch (err) {
        console.error(err);
        submitBtn.innerHTML = originalContent;
        submitBtn.classList.remove('loading');
        
        errorEl.textContent = 'Network error. Please check your connection.';
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
